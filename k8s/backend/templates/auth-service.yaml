{{- $name := include "pos-backend.name" (dict "root" . "key" "auth") }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name | quote }}
spec:
  type: {{ .Values.auth.service.type | quote }}
  ports:
    - name: http
      port: {{ .Values.auth.service.port }}
      targetPort: http
  selector:
    app: {{ $name | quote }}

