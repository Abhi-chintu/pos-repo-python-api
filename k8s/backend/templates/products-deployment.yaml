{{- $name := include "pos-backend.name" (dict "root" . "key" "products") }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name | quote }}
spec:
  replicas: {{ .Values.products.replicaCount }}
  selector:
    matchLabels:
      app: {{ $name | quote }}
  template:
    metadata:
      labels:
        app: {{ $name | quote }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: products
          image: "{{ .Values.products.image.repository }}:{{ .Values.products.image.tag }}"
          imagePullPolicy: {{ .Values.products.image.pullPolicy | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.products.service.targetPort }}
          env:
            - name: UVICORN_PORT
              value: {{ .Values.products.service.targetPort | quote }}
            - name: MYSQL_HOST
              value: {{ .Values.database.host | quote }}
            - name: MYSQL_PORT
              value: {{ .Values.database.port | quote }}
            - name: MYSQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret | quote }}
                  key: {{ .Values.database.keys.database | quote }}
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret | quote }}
                  key: {{ .Values.database.keys.username | quote }}
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret | quote }}
                  key: {{ .Values.database.keys.password | quote }}
          resources:
            {{- toYaml .Values.products.resources | nindent 12 }}

