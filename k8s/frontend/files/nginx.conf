limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;

server {
    listen {{ .Values.service.targetPort }};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    limit_req_status 429;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ~ ^/api/auth/(login|register)$ {
        limit_req zone=auth_limit burst=10 nodelay;
        proxy_pass http://{{ .Values.upstreams.auth.host }}:{{ .Values.upstreams.auth.port }};
    }

    location /api/auth/ {
        proxy_pass http://{{ .Values.upstreams.auth.host }}:{{ .Values.upstreams.auth.port }};
    }

    location /api/users {
        proxy_pass http://{{ .Values.upstreams.auth.host }}:{{ .Values.upstreams.auth.port }};
    }

    location /api/products {
        proxy_pass http://{{ .Values.upstreams.products.host }}:{{ .Values.upstreams.products.port }};
    }

    location /api/orders {
        proxy_pass http://{{ .Values.upstreams.orders.host }}:{{ .Values.upstreams.orders.port }};
    }

    location /api/kitchen {
        proxy_pass http://{{ .Values.upstreams.kitchen.host }}:{{ .Values.upstreams.kitchen.port }};
    }

    location = /api/health {
        proxy_pass http://{{ .Values.upstreams.orders.host }}:{{ .Values.upstreams.orders.port }}/api/orders/health;
    }

    location /api/ {
        return 404;
    }

    location = /docs {
        return 302 /api/orders/docs;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}

