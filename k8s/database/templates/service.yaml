apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.name | quote }}
spec:
  type: {{ .Values.service.type | quote }}
  selector:
    app: {{ .Values.name | quote }}
  ports:
    - name: mysql
      port: {{ .Values.service.port }}
      targetPort: mysql
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.headlessServiceName | quote }}
spec:
  clusterIP: None
  selector:
    app: {{ .Values.name | quote }}
  ports:
    - name: mysql
      port: {{ .Values.service.port }}
      targetPort: mysql

