apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Values.name | quote }}
spec:
  serviceName: {{ .Values.headlessServiceName | quote }}
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Values.name | quote }}
  template:
    metadata:
      labels:
        app: {{ .Values.name | quote }}
    spec:
      containers:
        - name: mysql
          image: {{ printf "%s:%s" .Values.image.repository .Values.image.tag | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy | quote }}
          args:
            - {{ printf "--port=%v" .Values.service.targetPort | quote }}
          ports:
            - name: mysql
              containerPort: {{ .Values.service.targetPort }}
          env:
            - name: MYSQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret | quote }}
                  key: {{ .Values.database.keys.database | quote }}
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret | quote }}
                  key: {{ .Values.database.keys.username | quote }}
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret | quote }}
                  key: {{ .Values.database.keys.password | quote }}
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret | quote }}
                  key: {{ .Values.database.keys.rootPassword | quote }}
          volumeMounts:
            - name: {{ .Values.persistence.claimTemplateName | quote }}
              mountPath: {{ .Values.persistence.mountPath | quote }}
              subPath: mysql
  volumeClaimTemplates:
    - metadata:
        name: {{ .Values.persistence.claimTemplateName | quote }}
      spec:
        accessModes:
          - {{ .Values.persistence.accessMode | quote }}
        {{- if .Values.persistence.storageClassName }}
        storageClassName: {{ .Values.persistence.storageClassName | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size | quote }}

